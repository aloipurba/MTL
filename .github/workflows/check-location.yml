name: Cek Lokasi Motor Terbaru

on:
  schedule:
    # Jalankan di menit ke-5 setiap jam (UTC).
    # Beri buffer 5 menit dari jadwal ESP32 kirim data di menit ke-0.
    - cron: '5 * * * *'
  workflow_dispatch: # supaya bisa di-trigger manual dari tab Actions di GitHub, untuk testing

jobs:
  cek-dan-notif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Jalankan pengecekan lokasi
        env:
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: node check-location.js

      - name: Commit state.json jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update state notifikasi terakhir"
            git fetch origin main
            git merge origin/main -X ours --no-edit
            git push
          fi
